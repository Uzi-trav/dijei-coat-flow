[build]
command = "pnpm run build"
publish = "dist"

[functions]
directory = "netlify/functions"

[build.environment]
NODE_VERSION = "22"

[[redirects]]
from = "/api/work-paper/recognize"
to = "/.netlify/functions/recognize-work-paper"
status = 200
force = true

[[redirects]]
from = "/*"
to = "/index.html"
status = 200
